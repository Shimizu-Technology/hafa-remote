name: iOS CI (manual)

on:
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: SwiftUI build and tests
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select release-eligible Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Run release, security, test, install, and launch gate
        run: ./scripts/gate.sh
        env:
          HAFA_GATE_WORK_DIR: '${{ runner.temp }}/HafaRemoteGate'
          HAFA_PRESERVE_GATE_ARTIFACTS: '1'

      - name: Upload test result on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: HafaRemoteTests-xcresult
          path: '${{ runner.temp }}/HafaRemoteGate/HafaRemoteTests.xcresult'
          retention-days: 7
