name: iOS CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

permissions:
  contents: read

# Both jobs run at the same time. Together they run the full ./scripts/gate.sh.
# A pull request that changes only docs/ or top-level Markdown skips the gate
# after a credential scan.
env:
  EVENT_NAME: '${{ github.event_name }}'
  PR_BASE: '${{ github.event.pull_request.base.sha }}'
  PR_HEAD: '${{ github.event.pull_request.head.sha }}'

jobs:
  test:
    name: SwiftUI build and tests
    runs-on: macos-26
    # Expected about 27 min.
    timeout-minutes: 55

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect app changes
        id: scope
        run: ./scripts/ci-change-scope.sh >>"$GITHUB_OUTPUT"

      - name: Scan documentation-only changes for credentials
        if: steps.scope.outputs.app == 'false'
        run: ./scripts/scan-secrets.sh

      - name: Select release-eligible Xcode
        if: steps.scope.outputs.app != 'false'
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Run release, security, test, install, and launch gate
        if: steps.scope.outputs.app != 'false'
        run: ./scripts/gate.sh
        env:
          HAFA_GATE_PHASES: 'checks internal'
          # One simulator: parallel simulators are slower and flakier on
          # this 3-CPU runner.
          HAFA_GATE_UI_WORKERS: '1'
          HAFA_GATE_WORK_DIR: '${{ runner.temp }}/HafaRemoteGate'
          HAFA_PRESERVE_GATE_ARTIFACTS: '1'

      - name: Upload test result on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: HafaRemoteTests-xcresult
          path: '${{ runner.temp }}/HafaRemoteGate/*.xcresult'
          retention-days: 7

  public:
    name: Public flavor build and tests
    runs-on: macos-26
    # Expected about 7 min.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect app changes
        id: scope
        run: ./scripts/ci-change-scope.sh >>"$GITHUB_OUTPUT"

      - name: Select release-eligible Xcode
        if: steps.scope.outputs.app != 'false'
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Build, validate, and test the public flavor
        if: steps.scope.outputs.app != 'false'
        run: ./scripts/gate.sh
        env:
          HAFA_GATE_PHASES: 'public'
          HAFA_GATE_WORK_DIR: '${{ runner.temp }}/HafaRemoteGate'
          HAFA_PRESERVE_GATE_ARTIFACTS: '1'

      - name: Upload test result on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: HafaRemotePublicTests-xcresult
          path: '${{ runner.temp }}/HafaRemoteGate/*.xcresult'
          retention-days: 7
